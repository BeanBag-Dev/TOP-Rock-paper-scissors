<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Rock Paper Scissors</title>
        <meta name="description" content="A simple Rock Paper Scissors Javascript game!">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>

        <script src="./rock-paper-scissors.js" defer></script>

        <div class="header">
            <h1>Rock, Paper, Scissors game!</h1>
            <p>Select one of the options and the computer will randomly select its choice.</p>
        </div>

        <div class="buttons">
            <button id="rock">🪨 Rock</button>
            <button id="paper">📄 Paper</button>
            <button id="scissors">✂️ Scissors</button>
        </div>
    </body>
</html>
